server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: xhs-ai-content-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:xhs_ai_content}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:xhs_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

xhs:
  profile:
    identity: ${XHS_PROFILE_IDENTITY:程序员AI副业博主}
    target-audience: ${XHS_PROFILE_TARGET_AUDIENCE:想做副业的人}
    content-style: ${XHS_PROFILE_CONTENT_STYLE:真实的个人成长记录}
    core-directions: ${XHS_PROFILE_CORE_DIRECTIONS:AI副业,AI工具,AI Coding,程序员副业,个人成长}
  cors:
    allowed-origins: ${XHS_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    provider: ${XHS_AI_PROVIDER:mock}
    base-url: ${XHS_AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${XHS_AI_API_KEY:}
    model: ${XHS_AI_MODEL:gpt-4.1-mini}
    temperature: ${XHS_AI_TEMPERATURE:0.7}
    connect-timeout: 10s
    read-timeout: 90s
    max-attempts: 2
  schedule:
    topic-enabled: ${XHS_TOPIC_SCHEDULE_ENABLED:true}
    topic-cron: ${XHS_TOPIC_SCHEDULE_CRON:0 0 8 * * ?}
    topic-count: ${XHS_TOPIC_DAILY_COUNT:5}

logging:
  level:
    root: INFO
    com.xhs.ai.content: INFO
