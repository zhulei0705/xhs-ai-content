spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:xhs_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  data:
    redis:
      repositories:
        enabled: false
xhs:
  ai:
    provider: mock
  schedule:
    topic-enabled: false
